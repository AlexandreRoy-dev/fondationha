# TEMPORAIRE : test de la synchro sur la branche de PR #7. A supprimer.
name: TEMP test synchro
on:
  push:
    branches: [cursor/fha-events-sync]
permissions:
  contents: write
concurrency:
  group: sync-events
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schema (cles, libelles, types seulement)
        env:
          GHL_FHA_TOKEN: ${{ secrets.GHL_FHA_TOKEN }}
          GHL_LOCATION_ID: ${{ vars.GHL_FHA_LOCATION_ID }}
        run: python scripts/_ghl_probe.py
      - name: Synchro
        env:
          GHL_FHA_TOKEN: ${{ secrets.GHL_FHA_TOKEN }}
          GHL_LOCATION_ID: ${{ vars.GHL_FHA_LOCATION_ID }}
        run: |
          python scripts/sync_events.py
          git status --porcelain data/ assets/images/events/
          [ -f data/events.json ] && python -c "import json;d=json.load(open('data/events.json'));print('count',d['count']);[print(e['slug'],'image' if e['image'] else 'no-image','gallery',len(e['gallery']),'billets',len(e['billets'])) for e in d['events']]" || true
          find assets/images/events -type f 2>/dev/null | head -20 || true
